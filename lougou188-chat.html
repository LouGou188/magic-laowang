<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LouGou188</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#151a24; --panel2:#1c2330; --line:#2a3342;
    --fg:#e8ecf4; --dim:#8b93a7; --acc:#3ec9ff; --acc2:#26e6bb;
    --mine:#2b6cff; --mine-b:#12306e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1100px 700px at 50% -10%, #1a2233 0%, var(--bg) 60%);
    color:var(--fg);
    font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .card{
    width:min(600px,100%);
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);
    display:flex;flex-direction:column;height:min(760px,92vh);
  }
  /* 对话框正上方的标题 */
  .head{
    text-align:center;padding:16px 10px 14px;
    border-bottom:1px solid var(--line);background:var(--panel2);
    flex:0 0 auto;
  }
  .head .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#34d399;margin-right:8px;vertical-align:1px;box-shadow:0 0 10px rgba(52,211,153,.8);}
  .head .name{font-size:20px;font-weight:800;letter-spacing:.14em;color:#fff;font-family:Consolas,"Courier New",monospace;}
  .msgs{
    flex:1 1 auto;overflow-y:auto;padding:18px 16px;display:flex;
    flex-direction:column;gap:12px;scroll-behavior:smooth;
  }
  .row{display:flex;gap:8px;align-items:flex-end;}
  .row.me{flex-direction:row-reverse;}
  .avatar{
    width:32px;height:32px;border-radius:50%;flex:0 0 32px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;background:linear-gradient(135deg,#3ec9ff,#2b6cff);
  }
  .row.me .avatar{background:linear-gradient(135deg,#34d399,#0ea472);}
  .bubble{
    max-width:76%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.7;
    background:var(--panel2);border:1px solid var(--line);
    border-bottom-left-radius:4px;word-break:break-word;white-space:pre-wrap;
  }
  .row.me .bubble{
    background:linear-gradient(135deg,var(--mine-b),#0e1f4d);border-color:#2b4caa;
    border-bottom-left-radius:14px;border-bottom-right-radius:4px;
  }
  .typing{
    display:none;gap:8px;align-items:flex-end;
  }
  .typing.show{display:flex;}
  .typing .bubble{padding:13px 15px;}
  .typing i{
    width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;
    animation:blink 1.2s infinite;
  }
  .typing i:nth-child(2){animation-delay:.2s;}
  .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
  .inputbar{
    flex:0 0 auto;display:flex;gap:10px;padding:12px;
    border-top:1px solid var(--line);background:var(--panel2);
  }
  .inputbar input{
    flex:1;background:#0d121c;border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:12px 16px;font-size:15px;outline:none;
  }
  .inputbar input:focus{border-color:var(--acc);}
  .inputbar input::placeholder{color:#5b637a;}
  .send{
    border:none;background:var(--acc);color:#06121c;font-weight:700;
    border-radius:12px;padding:0 22px;font-size:15px;cursor:pointer;letter-spacing:.1em;
  }
  .send:hover{filter:brightness(1.15);}
  .send:active{transform:translateY(1px);}
</style>
</head>
<body>
<div class="card">
  <!-- 对话框正上方 -->
  <div class="head">
    <span class="dot"></span><span class="name">LouGou188</span>
  </div>

  <div class="msgs" id="msgs">
    <div class="row bot">
      <div class="avatar">L</div>
      <div class="bubble">你好，有什么想说的？</div>
    </div>
    <div class="typing" id="typing">
      <div class="avatar">L</div>
      <div class="bubble"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="inputbar">
    <input id="input" type="text" placeholder="输入你想说的话…" autocomplete="off"/>
    <button class="send" id="send">发送</button>
  </div>
</div>

<script>
"use strict";
/* ================= 应答规则 ================= */
const RULES = {
  "电子老王":      "不会剪辑的老王不是好的原学家",
  "电子坤睿":      "你做动画给我做好了呀，而且一万格一点都不远",
  "电子程程":      "给你电脑是让你整活的，不是让你成天打游戏的",
  "电子deruang":   "快点练习端游技术，糖到我了",
  "电子鸡":        "！？坤坤？！",
  "太电了，把老袁也卷进来了": "我依稀记得老袁在过年时做过一个拜年的网页",
  "LouGou188":     "恭喜你中大奖了，凭此截屏到我指定邮箱领取大奖"
};
const FALLBACK = [
  "回想一下你拿到了什么",
  "谜底就在谜面上",
  "这很费token的",
  "本网页由DSH协助制作",
  "有什么问题，就在群聊里讨论吧"
];

/* ================= DOM ================= */
const msgs = document.getElementById("msgs");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const typing = document.getElementById("typing");

let lastFallback = -1;

function replyOf(text){
  if (RULES.hasOwnProperty(text)) return { text: RULES[text], rule: true };
  let idx;
  do { idx = (Math.random() * FALLBACK.length) | 0; }
  while (FALLBACK.length > 1 && idx === lastFallback);
  lastFallback = idx;
  return { text: FALLBACK[idx], rule: false };
}

function bubble(text, isMe){
  const row = document.createElement("div");
  row.className = "row " + (isMe ? "me" : "bot");
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = isMe ? "我" : "L";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(av);
  row.appendChild(b);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return b;
}

function send(){
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  bubble(text, true);

  const { text: reply } = replyOf(text);
  // 先显示“正在输入”，再延迟出回复
  typing.classList.add("show");
  msgs.scrollTop = msgs.scrollHeight;
  const delay = 450 + Math.random() * 500;
  setTimeout(() => {
    typing.classList.remove("show");
    bubble(reply, false);
  }, delay);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey){
    ev.preventDefault();
    send();
  }
});
</script>
</body>
</html>
